{% load static legal %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Unlist{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'unlist/unlist.css' %}">
  <script src="{% static 'unlist/htmx.min.js' %}" defer></script>
</head>
<body>
  {% block body %}
  <main class="narrow">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <footer class="site-footer muted">
    Unlist is free software (AGPL-3.0-or-later) · <a href="{% source_url %}">Source</a> · <a href="{% url 'legal:about' %}">About</a>
  </footer>
</body>
</html>
