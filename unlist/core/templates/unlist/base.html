{% load static legal %}<!doctype html>
{# SPDX-License-Identifier: AGPL-3.0-or-later #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Unlist{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'unlist/unlist.css' %}">
  {# htmx would add an inline <style>, which the Content-Security-Policy blocks. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <script src="{% static 'unlist/htmx.min.js' %}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}
  <a class="skip-link" href="#main">Skip to the content</a>
  <div class="app">
    <header class="topbar">
      <details>
        <summary><span class="brand">Unlist</span> <span class="menu-label">Menu{% if sidebar.needs_you %} · {{ sidebar.needs_you }} waiting{% endif %}</span></summary>
        {% include "unlist/_nav.html" %}
      </details>
    </header>
    <aside class="sidebar">
      <a class="brand" href="{% url 'home' %}">Unlist</a>
      {% include "unlist/_nav.html" %}
    </aside>
    <main id="main" class="app-main">
      <div class="page">
        {% include "unlist/_messages.html" %}
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="site-footer">
      Unlist is free software (AGPL-3.0-or-later) · <a href="{% source_url %}">Source</a> · <a href="{% url 'legal:about' %}">About</a>
    </footer>
  </div>
  {% endblock %}
</body>
</html>
