{% extends "unlist/base.html" %}
{# SPDX-License-Identifier: AGPL-3.0-or-later #}
{% block title %}Add a detail · Unlist{% endblock %}
{% block content %}
<p class="breadcrumb"><a href="{% url 'subjects:detail' subject.pk %}">{{ subject.name }}</a></p>
<h1>Add an identifying detail for {{ subject.name }}</h1>
<form method="post" class="card">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="primary">Add</button>
</form>
{% endblock %}
