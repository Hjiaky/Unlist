{% extends "unlist/base.html" %}
{% block title %}Add an email address - Unlist{% endblock %}
{% block content %}
<h1>Add an email address for {{ subject.name }}</h1>
<form method="post" class="card">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="primary">Add</button>
</form>
<p><a href="{% url 'subjects:detail' subject.pk %}">Back</a></p>
{% endblock %}
